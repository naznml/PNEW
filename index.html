function evidence(q,correct){
  const text = (q + " " + correct).toLowerCase();

  if(text.includes("жаттығу")){
    return "Бұл сұрақ жаттығу түрлеріне қатысты. Дұрыс жауап жаттығудың негізгі қызметіне қарай анықталады.";
  }
  if(text.includes("әдіснама")){
    return "Әдіснама — ғылыми танымға жету мен оны құрудың теориялық жолдарын анықтайтын ұғым.";
  }
  if(text.includes("технология")){
    return "Педагогикалық технология алдын ала жоспарланған нәтижеге жетуге бағытталған әдіс-тәсілдер жүйесін білдіреді.";
  }
  if(text.includes("педагогикалық әрекет") || text.includes("педагогикалық процесс")){
    return "Педагогикалық процесс пен әрекет оқыту, тәрбиелеу және дамыту міндеттерін біріктіреді.";
  }
  if(text.includes("отбасы")){
    return "Отбасы педагогикасы бала тәрбиесін, ата-ананың тәрбиелік ықпалын және отбасындағы даму жағдайларын зерттейді.";
  }
  if(text.includes("білім") && !text.includes("сапасы") && !text.includes("стандарты")){
    return "Білім — ұғымдар, деректер, пайымдаулар мен түсініктер жүйесі.";
  }
  if(text.includes("білік")){
    return "Білік — алған білімді іс жүзінде қолдана алу қабілеті.";
  }
  if(text.includes("дағды")){
    return "Дағды — қайталану арқылы автоматтандырылған әрекет.";
  }
  if(text.includes("сапасы")){
    return "Білім беру сапасы білімнің стандарттар мен нормаларға сәйкестігін білдіреді.";
  }
  if(text.includes("өзін-өзі бақылау")){
    return "Өзін-өзі бақылау — адамның өз әрекетін тексеріп, бағалап, реттеуі.";
  }
  if(text.includes("тәрбие")){
    return "Тәрбие жеке тұлғаның қасиеттерін, мінез-құлқын және құндылықтарын қалыптастыруға бағытталады.";
  }
  if(text.includes("әлеуметтену")){
    return "Әлеуметтену — адамның қоғамдағы нормалар мен құндылықтарды меңгеруі.";
  }
  if(text.includes("оқу жоспары")){
    return "Оқу жоспары пәндердің тізімін, көлемін және оқу уақытын белгілейді.";
  }
  if(text.includes("оқу бағдарламасы")){
    return "Оқу бағдарламасы пән бойынша мазмұнды, тақырыптарды және талаптарды анықтайды.";
  }
  if(text.includes("стандарты")){
    return "Білім беру стандарты оқушылардың дайындық деңгейіне қойылатын мемлекеттік талаптарды белгілейді.";
  }
  if(text.includes("сабақ")){
    return "Сабақ — мұғалім мен оқушылардың оқу жұмысын ұйымдастыруының негізгі формасы.";
  }
  if(text.includes("қағида")){
    return "Қағида — оқыту мен тәрбиені ұйымдастырудағы негізгі талап.";
  }
  if(text.includes("заңдылық")){
    return "Педагогикалық заңдылық педагогикалық құбылыстар арасындағы тұрақты байланысты білдіреді.";
  }

  return "Бұл жауап сұрақтағы сипаттамаға сәйкес келетін педагогикалық ұғымды білдіреді.";
}

function render(){
  const nav = document.getElementById("nav");
  const app = document.getElementById("app");

  nav.innerHTML = DATA.map((variant,i)=>`<a href="#v${i+1}">${variant.title}</a>`).join("");

  app.innerHTML = DATA.map((variant,vi)=>{
    const questionsHTML = variant.items.map((item,qi)=>{
      return `
        <div class="q">
          <div class="qtitle">${qi + 1}. ${item.q}</div>
          ${item.options.map((opt,oi)=>`
            <label class="opt">
              <input type="radio" name="v${vi}-q${qi}" value="${oi}">
              ${String.fromCharCode(65 + oi)}) ${opt}
            </label>
          `).join("")}
        </div>
      `;
    }).join("");

    return `
      <section class="card" id="v${vi+1}">
        <div class="head">
          <div>
            <h2>${variant.title}</h2>
            <div class="desc">
              Бұл вариантта 30 сұрақ бар. Барлық сұраққа жауап беріп, соңында нәтижені көріңіз.
            </div>
          </div>
          <span class="badge">${variant.items.length} сұрақ</span>
        </div>

        ${questionsHTML}

        <button class="btn" onclick="checkVariant(${vi})">Нәтижені көрсету</button>
        <div class="result" id="result-${vi}"></div>
      </section>
    `;
  }).join("") + `
    <div class="footer">
      © @elnazm_ln — Бұл сайтты көшіруге, қайта сатуға және таратуға тыйым салынады.
    </div>
  `;
}

function checkVariant(vi){
  const variant = DATA[vi];
  const box = document.getElementById("result-" + vi);

  let score = 0;
  let html = "";

  variant.items.forEach((item,qi)=>{
    const selected = document.querySelector(`input[name="v${vi}-q${qi}"]:checked`);
    const selectedIndex = selected ? Number(selected.value) : -1;
    const ok = selectedIndex === item.answer;

    if(ok) score++;

    const yourAnswer = selectedIndex >= 0
      ? `${String.fromCharCode(65 + selectedIndex)}) ${item.options[selectedIndex]}`
      : "Жауап таңдалмаған";

    const correctAnswer = `${String.fromCharCode(65 + item.answer)}) ${item.options[item.answer]}`;

    html += `
      <div class="ans ${ok ? "ok" : "bad"}">
        <div><b>${qi + 1}. ${item.q}</b></div>

        <div class="${ok ? "oktxt" : "badtxt"}">
          ${ok ? "Дұрыс" : "Қате"}
        </div>

        <div class="ex">
          <b>Сіздің жауабыңыз:</b><br>
          ${yourAnswer}
        </div>

        <div class="ex">
          <b>Дұрыс жауап:</b><br>
          ${correctAnswer}
        </div>

        <div class="ex">
          <b>Түсіндірме / дәлел:</b><br>
          ${evidence(item.q,item.options[item.answer])}
        </div>
      </div>
    `;
  });

  const percent = Math.round(score / variant.items.length * 100);

  box.innerHTML = `
    <div class="summary">
      <h3>${score} / ${variant.items.length} дұрыс</h3>
      <p>Нәтиже: <b>${percent}%</b></p>
    </div>
    ${html}
  `;

  box.scrollIntoView({behavior:"smooth", block:"start"});
}

render();

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());

document.addEventListener("keydown", function(e){
  const k = e.key.toUpperCase();

  if(
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(k)) ||
    (e.ctrlKey && ["U","S","P","A","C"].includes(k))
  ){
    e.preventDefault();
  }
});
